[package]
name = "project-nucleus"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "project_nucleus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri-plugin-clipboard-manager = "2.3.2"
ashpd = { version = "0.13.13", features = ["screenshot", "settings"] }
zbus = "5"
tokio = { version = "1.53.1", default-features = false, features = ["time"] }
# Already in the dependency tree via ashpd; declared directly to consume its
# Settings-portal change stream (StreamExt::next).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Both already in the dependency tree via Tauri's own GTK backend; declared
# directly to reach the panel's underlying X11 window when claiming focus
# (see src/focus.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"

