name: Build packages

# Builds all four package formats and keeps them as workflow artifacts.
# Nothing here publishes anywhere (Snap Store, GitHub Releases, Flathub) --
# that stays a manual, approved step. See docs/DECISIONS.md and state.md for
# the reasoning behind each package's shape.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  deb-appimage:
    name: .deb / AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build .deb and AppImage
        run: npm run tauri build -- --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  snap:
    name: Snap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Handles the LXD-backed build for us -- doing this by hand in Adım 4
      # needed `sg lxd -c "snapcraft ..."`; the action already runs as a
      # member of the lxd group.
      - uses: snapcore/action-build@v1
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The community flatpak-github-actions container images only go up to
      # gnome-47 (checked against the image's own tag list) -- GNOME 50 is
      # newer than that image's release cadence, though already on Flathub
      # itself (confirmed locally in Adım 5). Installing flatpak-builder
      # directly and pulling the runtime from Flathub sidesteps the image's
      # lag entirely, and matches the exact steps used for the local build.
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME 50 runtime and SDK
        run: |
          sudo flatpak install --system -y flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//50 \
            org.freedesktop.Sdk.Extension.node22//50

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --repo=flatpak-repo \
            build-dir flatpak/com.gokcank.project-nucleus.yml
          flatpak build-bundle flatpak-repo nucleus.flatpak \
            com.gokcank.project-nucleus

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: nucleus.flatpak
